<app-header></app-header>
<main class="reports-shell">

<h5 class="text-center fw-bold text-danger" style="">
  <u>Parcel Branch Wise Collection Report</u>
</h5>

<div class="container section-border  pb-4" >
  <div class="rounded  ">
    <form [formGroup]="form">
      <div class="row mb-3">
        
        <div class="col-md-6">
          <label class="form-label">From Booking Date</label>
          <input type="date" class="form-control form-control-sm" formControlName="fromDate" />
        </div>

        
        <div class="col-md-6">
          <label class="form-label">To Date</label>
          <input type="date" class="form-control form-control-sm" formControlName="toDate" />
        </div>

        
        <div class="col-md-6">
          <label class="form-label">Branch City:</label>
          <select #selectElem  class="form-select form-select-sm" formControlName="fromCity">
            <option value="" selected>Select City</option>
            <option *ngFor="let item of citydata" [value]="item.cityName">{{ item.cityName }}</option>
          </select>
        </div>

        
        <div class="col-md-6">
          <label class="form-label">Branch Name:</label>
          <select #pickupbranch class="form-select form-select-sm" formControlName="pickUpBranch">
            <option value="" selected> select Branch </option>
            <option *ngFor="let row4 of pdata" [value]="row4.branchUniqueId"> {{ row4.name }} </option>
          </select>
        </div>

        
        

        
        <div class="container mt-4">
          <div class="row">
            
            
        
            
            <div class="text-center">
              <button type="button" class="btn btn-success " (click)="getCollectionReport()">Load</button>
            </div>

          </div>
        </div>
        

      </div>
    </form>
  </div>
</div>

</main>
